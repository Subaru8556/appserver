<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務アプリケーションポータル</title>
  <link rel="stylesheet" href="/shared/vibe.css">
  <script src="/shared/lifecycle.js"></script>
  <style>
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }
    .app-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--vibe-shadow-md);
      border-color: var(--vibe-primary);
    }
    .app-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--vibe-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-card-desc { color: var(--vibe-text-sub); font-size: 13px; }
  </style>
</head>
<body>
  <header class="vibe-header">
    <div class="vibe-header-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--vibe-primary)"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/></svg>
      業務アプリケーションポータル
    </div>
  </header>

  <main class="vibe-container">
    <h2 style="font-size: 18px; margin-bottom: 4px;">アプリケーション一覧</h2>
    <p style="color: var(--vibe-text-sub); font-size: 13px;">利用する業務ツールを選択してください。</p>
    <div id="appGrid" class="app-grid"></div>
  </main>

  <script>
    fetch('/api/portal/apps')
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('appGrid');
        grid.innerHTML = data.apps.map(app => `
          <a href="${app.path}" class="vibe-card app-card">
            <div>
              <div class="app-card-title">
                <span>📁</span>
                <span>${app.name}</span>
              </div>
              <p class="app-card-desc">${app.description}</p>
            </div>
            <div style="margin-top: 16px; text-align: right; font-size: 12px; font-weight: 600; color: var(--vibe-primary);">
              アプリを開く →
            </div>
          </a>
        `).join('');
      });

    async function shutdownApp() {
      if (!confirm("アプリケーション（ローカルサーバ）を終了しますか？")) return;
      try {
        await fetch('/api/system/shutdown');
      } catch (e) {}
      window.close();
      // 通常のブラウザタブで開いていて window.close() が効かない場合の表示
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#666;">サーバを停止しました。このウィンドウを閉じてください。</div>';
    }
  </script>
</body>
</html>
